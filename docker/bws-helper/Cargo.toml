[package]
name = "fieldops-bws-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "UNLICENSED"

[dependencies]
bitwarden = { git = "https://github.com/bitwarden/sdk-sm.git", rev = "03a4220327bfdb00b8aec3179c81f9e62f1fcde1", package = "bitwarden", features = ["secrets"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.26.1", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
