---
name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    name: Validate, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: gd, intl, mbstring, pcntl, pdo_pgsql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Run PHPUnit suite
        env:
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        run: php -d memory_limit=-1 ./vendor/bin/phpunit

  container-build:
    name: Build production container targets (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        env:
          FIELDOPS_VERSION: ci
          FIELDOPS_ENV_FILE: /dev/null
          FIELDOPS_PG_CA_FILE: /dev/null
        run: |
          docker compose -f compose.prod.yml config --quiet
          images="$(docker compose -f compose.prod.yml config --images)"
          grep -Fqx 'ghcr.io/xinterloperx/fieldops-public-app:ci' <<< "$images"
          grep -Fqx 'ghcr.io/xinterloperx/fieldops-public-web:ci' <<< "$images"

      - name: Build PHP-FPM application image
        run: docker build --file docker/php/Dockerfile --tag fieldops-public-app:ci .

      - name: Build Nginx web image
        run: |
          docker build \
            --file docker/nginx/Dockerfile \
            --build-arg APP_IMAGE=fieldops-public-app:ci \
            --tag fieldops-public-web:ci \
            .

  release:
    name: Publish release images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [quality, container-build]
    permissions:
      contents: write
      packages: write
    concurrency:
      group: fieldops-public-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version tag on main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Refuse existing public releases and image tags
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const { RELEASE_TAG: tag, SOURCE_SHA: sourceSha } = process.env;

            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.setFailed(`A GitHub Release already exists for ${tag}; refusing to replace it.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            async function packageHasTag(packageName, imageTag) {
              let versions;
              try {
                versions = await github.paginate(
                  "GET /users/{username}/packages/container/{package_name}/versions",
                  {
                    username: context.repo.owner,
                    package_name: packageName,
                    per_page: 100,
                  },
                );
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }

              return versions.some((version) =>
                version.metadata?.container?.tags?.includes(imageTag),
              );
            }

            for (const packageName of ["fieldops-public-app", "fieldops-public-web"]) {
              for (const imageTag of [tag, `sha-${sourceSha}`]) {
                if (await packageHasTag(packageName, imageTag)) {
                  core.setFailed(`Image tag ${packageName}:${imageTag} already exists; refusing to overwrite it.`);
                  return;
                }
              }
            }

      - name: Resolve lowercase GHCR namespace
        id: registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "namespace=ghcr.io/${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish PHP-FPM application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.namespace }}/fieldops-public-app:${{ github.ref_name }}
            ${{ steps.registry.outputs.namespace }}/fieldops-public-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Publish Nginx web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          build-args: >-
            APP_IMAGE=${{ steps.registry.outputs.namespace }}/fieldops-public-app:${{ github.ref_name }}
          push: true
          tags: |
            ${{ steps.registry.outputs.namespace }}/fieldops-public-web:${{ github.ref_name }}
            ${{ steps.registry.outputs.namespace }}/fieldops-public-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FieldOps ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
