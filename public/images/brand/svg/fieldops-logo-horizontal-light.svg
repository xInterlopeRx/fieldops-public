     width="1040" height="256" viewBox="0 0 1040 256" version="1.1"
     role="img" aria-labelledby="title desc">
  <title id="title">FieldOps horizontal logo for light backgrounds</title>
  <desc id="desc">FieldOps blue and orange F logo</desc>
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" inkscape:document-units="px" showgrid="false"/>
  <defs>
    <linearGradient id="fieldopsBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087FF5"/>
      <stop offset="1" stop-color="#0566D6"/>
    </linearGradient>
  </defs>
<g inkscape:groupmode="layer" inkscape:label="FieldOps Mark" id="fieldops-mark" transform="translate(0 0) scale(1)">
    <path id="outer-f" aria-label="Outer F and shield" fill="url(#fieldopsBlue)" d="M48 24 C30 24 20 35 20 53 L20 181 L76 232 L76 82 C76 72 82 66 92 66 L207 66 C220 66 231 56 235 44 L241 24 Z"/>
    <path id="middle-bar" aria-label="Middle bar" fill="url(#fieldopsBlue)" d="M92 99 H207 C207 124 191 137 171 137 H92 Z"/>
    <path id="orange-progress" aria-label="Orange progress wedge" fill="#FF7A1A" d="M92 155 H171 L92 232 Z"/>
  </g>
<g inkscape:groupmode="layer" inkscape:label="Wordmark" id="wordmark">
    <text x="295" y="166" id="fieldops-wordmark" fill="#0B172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">FieldOps</text>
  </g>
</svg>
